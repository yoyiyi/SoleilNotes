name: docs-check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 检查相对链接与图片引用
        run: python scripts/check_links.py

      - name: 确认 INDEX.md 与文件树一致
        run: python scripts/gen_index.py --check
